name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  docker:
  name: Docker Build & Run
  runs-on: ubuntu-latest
  needs: analyze

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t go-web-server .

    - name: Run container
      run: |
        docker run -d -p 8080:8080 --name test-server go-web-server
        echo "Waiting for server..."
        sleep 10

    - name: Debug container logs
      if: always()
      run: |
        docker ps -a
        docker logs test-server || true

    - name: Test readfile endpoint
      run: curl --fail "http://localhost:8080/readfile?file=safe-files/hello.txt"

    - name: Stop container
      if: always()
      run: docker stop test-server || true